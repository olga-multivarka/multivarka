<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: мультяшная «кухня мультиков» — толстые контуры, жёсткие тени-наклейки, одна колонка до 920px */
:root{
  --ink:#1d1640;--paper:#fff8e7;--card:#ffffff;
  --sun:#ffd23f;--pink:#ff5d8f;--sky:#3ec5ff;--lime:#7ee081;--grape:#9b6bff;
  --muted:#6b6290;--soft:#f3ecff;--skysoft:#e3f6ff;--bad:#ffd9d9;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px;color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);background-image:radial-gradient(var(--soft) 2px,transparent 2px);background-size:26px 26px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(26px,5vw,38px);font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border:3px solid var(--ink);border-radius:16px;background:var(--pink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;transform:rotate(-6deg);flex:none}
.logo svg{width:38px;height:38px}
.tag{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.btn{border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.card:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.opt:focus-visible,.tab:focus-visible,.st:focus-visible,.item:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn.sun{background:var(--sun)}.btn.pink{background:var(--pink)}.btn.sky{background:var(--sky)}.btn.lime{background:var(--lime)}
.btn.small{padding:5px 11px;font-size:14px;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn.danger{background:var(--bad)}
.back{background:none;border:none;font-weight:800;cursor:pointer;padding:4px 0;color:var(--muted);font-size:15px;align-self:flex-start}
.back:hover{color:var(--ink)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .1s;min-width:0}
.card:hover{transform:translate(-2px,-2px) rotate(-.5deg)}
.card .face{height:70px;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--display);font-weight:800;font-size:28px}
.card.add{background:transparent;border-style:dashed;box-shadow:none;align-items:center;justify-content:center;min-height:160px;color:var(--muted);font-weight:800}
.card.add:hover{background:var(--card);color:var(--ink)}
.meta{font-size:14px;color:var(--muted);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--soft)}
.chip.done{background:var(--lime)}
.dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;background:var(--card)}
.dot.on{background:var(--lime)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{border:3px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:800;background:var(--card);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sun)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.qlabel{font-weight:800;font-size:15px}
.hint{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],textarea,select{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fffdf6;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.45}
textarea[readonly]{background:var(--skysoft);font-size:14px}
.rowf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.rowf{grid-template-columns:1fr}}
.fieldtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.title-input{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,28px);border:none!important;border-bottom:3px dashed var(--muted)!important;border-radius:0!important;background:transparent!important;padding:4px 0!important}
.stepper{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px}
.st{flex:1 0 auto;min-width:118px;border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.st .n{font-family:var(--display);font-size:13px;font-weight:800}
.st .t{font-weight:800;font-size:14px}
.st.done{background:var(--lime)}
.st[aria-current="step"]{box-shadow:4px 4px 0 var(--ink);background:var(--sun);transform:translateY(-2px)}
.stephead{display:flex;gap:14px;align-items:flex-start}
.bignum{flex:none;width:54px;height:54px;border:3px solid var(--ink);border-radius:50%;background:var(--pink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:3px 3px 0 var(--ink)}
.lib-thumb{display:flex;gap:10px;align-items:center;min-width:0}
.ava{width:46px;height:46px;flex:none;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.ava.sq{border-radius:12px}
.libcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.libcols{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--card);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%}
.item:hover{background:var(--soft)}
.empty{border:3px dashed var(--muted);border-radius:14px;padding:14px;color:var(--muted);font-weight:700;font-size:14px}
.badge{display:inline-block;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;transform:rotate(-2deg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sun);padding:10px 18px;border-radius:99px;font-weight:800;z-index:50;max-width:calc(100% - 32px);text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(29,22,64,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.saved{font-size:13px;font-weight:800;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cons{border:3px solid var(--ink);border-radius:var(--r);background:var(--soft);padding:16px;display:flex;flex-direction:column;gap:22px}
.cons-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--ink);border-radius:99px;background:var(--card);padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s;text-align:left}
.opt:hover{transform:translateY(-1px);background:#fff3c4}
.opt[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:2px 2px 0 var(--ink);font-weight:800}
.opts.big .opt{border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;flex:1 1 200px;max-width:100%}
.opt small{font-weight:600;font-size:12.5px;opacity:.85}
.count{font-size:12px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 8px;margin-left:6px}
.sketch{background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sketch p{margin:0;font-weight:700;font-size:16px;white-space:pre-line}
.out{display:flex;flex-direction:column;gap:18px}
.howto{background:var(--skysoft);border:3px solid var(--ink);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.howto b.h{font-family:var(--display);font-size:14px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14.5px}
.result{border-top:3px dashed var(--muted);padding-top:18px}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}
.meter{flex:1 1 220px;height:22px;border:3px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:8px 10px}
.tile b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;display:block}
.tile span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.checks{grid-template-columns:1fr}}
.checks ul{margin:0;padding-left:18px;font-weight:600;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.own{border-style:dashed!important;background:var(--card)!important;font-size:14.5px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.stile{border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:center;font-weight:700;font-size:13px;line-height:1.2;text-align:center;transition:transform .1s}
.stile svg{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;border:2px solid var(--ink);display:block}
.stile:hover{transform:translateY(-2px) rotate(-1deg)}
.stile small{font-weight:600;font-size:11px;line-height:1.25;opacity:.8}
.stile img{width:100%;aspect-ratio:1;max-width:100%;object-fit:cover;border-radius:10px;border:2px solid var(--ink);display:block}
.subq{display:flex;flex-direction:column;gap:22px;border-top:3px dashed var(--muted);padding-top:18px}
.htabs .tab{padding:6px 13px;font-size:14px;border-width:2px}
.modes .tab{font-size:14px}
.chooser{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:620px){.chooser{grid-template-columns:1fr}}
.chooser .card{min-height:130px}
.game{display:flex;flex-direction:column;gap:16px}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter.small{height:14px;flex:none;width:100%}
.gq{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,26px);line-height:1.2;text-wrap:balance}
.stile[aria-pressed="true"]{background:var(--pink);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.stile:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.opts.gopts .opt{font-size:15px;padding:8px 14px}
.stile{position:relative}
.zbtn{position:absolute;top:8px;right:8px;background:var(--card);border:2px solid var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px;color:var(--ink)}
.zoom{position:fixed;z-index:60;right:calc(24px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);pointer-events:none}
.zoom.sticky{inset:0;right:auto;top:auto;transform:none;background:rgba(29,22,64,.6);display:grid;place-items:center;pointer-events:auto;padding:16px}
.zbox{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:10px;width:min(380px,90vw);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;cursor:pointer}
.zbox img,.zbox svg{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid var(--ink);object-fit:cover;display:block}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rchip{border:2px solid var(--ink);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:800;background:var(--card);cursor:pointer}
.rchip[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.crow{display:flex;flex-direction:column;gap:6px}
.myans{border-top:2px dashed var(--muted);padding-top:10px}
.myans summary{cursor:pointer;font-weight:800}
.sumblock{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sumrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;font-size:14px;border-bottom:1px solid var(--soft);padding-bottom:6px}
.sq{color:var(--muted);font-weight:700}.sa{font-weight:700;min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.sumrow{grid-template-columns:1fr auto}.sumrow .sq{grid-column:1/-1}}
.pblock{border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.phead{display:flex;gap:12px;align-items:center}
.pnum{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.psteps{margin:0;padding-left:20px;font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.sugg{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:14.5px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Тема «Сказочный лубок» (29.10) ===== */
:root{--ink:#1E3A2C;--paper:#FBF3E4;--card:#FFFDF8;--sun:#E2A93B;--pink:#B3263E;--sky:#1E4634;--lime:#9CC17A;--grape:#7A4E9B;--muted:#5B4A3A;--soft:#F1E4CC;--skysoft:#EEF4EC;--bad:#F6D5D5;
  --display:"Rubik","Segoe UI",system-ui,sans-serif;--body:"Rubik","Segoe UI",system-ui,sans-serif}
body{font-size:17px}
h1{font-family:"Ruslan Display",Georgia,serif;font-weight:400;color:var(--pink);letter-spacing:.01em}
.btn.pink,.btn.sky,.bignum,.ava{color:#fff}
.opt{font-size:16px;padding:8px 15px}
.hint{font-size:14.5px}.meta{font-size:15px}.chip{font-size:14px}
textarea[readonly]{font-size:15px}
.gq{font-weight:700}
.yaga{display:flex;align-items:flex-end;gap:10px;background:var(--sky);border:3px solid var(--ink);border-radius:24px;padding:14px 16px 0 10px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.yaga svg{flex:none;width:130px;height:146px}
.yaga .bubble{flex:1;background:#fff;border-radius:18px 18px 18px 4px;padding:12px 14px;margin-bottom:22px;font-size:18px;line-height:1.35;font-weight:600;color:var(--ink)}
</style>

<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal-bg" hidden></div>
<div id="zoom" class="zoom" hidden></div>

<script>
const KEY='multimaster-v1';
const COLORS=['#ffd23f','#3ec5ff','#ff5d8f','#7ee081','#9b6bff','#ff9f43'];
const STEPS=[
  {id:'idea',n:1,t:'Идея',q:'С чего начать ролик?',res:['Идея ролика','Выбери заготовку или вставь лучшую из 5 идей ChatGPT']},
  {id:'twist',n:2,t:'Докрутка',q:'Превращаем тему в ситуацию',res:['Ситуация для ролика','Готовый сюжет в 1–2 предложениях']},
  {id:'story',n:3,t:'Storyboard',q:'Раскладываем ролик на кадры',res:['Раскадровка','Вставь сюда текст кадров из ChatGPT']},
  {id:'final',n:4,t:'Финал',q:'Усиливаем последние кадры',res:['Цельный сюжет с новым финалом','Вставь ответ ChatGPT на промпт «Для проверки»']},
  {id:'check',n:5,t:'Проверка',q:'Где история может просесть?',res:['Заметки: что поправить','Можно записать сюда правки из проверки']}
];

/* ===== Справочники ===== */
const BANK={
  goal:[['',['Для себя','Дети и семья','День рождения','Свадьба / история пары','Путешествие','Питомцы','Для блога','Экспертный контент','Для бизнеса','Товар','Услуга','Клиент / портфолио']]],
  emo:[['Тёплое',['Уют','Трогательно','Ностальгия','Романтика','Вдохновение','Милота']],['Смешное',['Смешно','Абсурд','Ирония']],['Вау',['Удивление','Волшебство','Превращение']],['Напряжение',['Саспенс','Тайна','Драма']]],
  fmt:[['Сюжетные',['Мини-история','Квест / поиск / спасение','Диалог / спор','POV — глазами героя','Личная история']],['Сериальные',['Рубрика','Ситком','С продолжением']],['Для бизнеса',['Реклама','Проблема → решение','Товар в деле','Было → стало (кейс)']],['Визуальные',['Трансформация','Портал в другой мир','До / после','Петля']]]
};

"},{"v":"Первым делом проверяет, никто ли не порезался","a":"Заботливый"},{"v":"Хватает веник и убирает, а заодно вытирает весь стол","a":"Хлопотун"}]},{"q":"У друга что-то не получается, и он расстроен. Что он делает?","o":[{"v":"Садится рядом: «Давай вместе»","a":"Верный друг"},{"v":"«Дай я! Сейчас всё исправлю»","a":"Спасатель-герой"},{"v":"Говорит пару слов, и другу сразу становится легче","a":"Мудрец"},{"v":"Задумывается: «А может, так и должно было случиться?»","a":"Философ"},{"v":"Показывает, как сделать красиво и аккуратно","a":"Эстет"},{"v":"Готов помочь, но спрашивает: «А мне что за это?»","a":"Жадина-скряга"},{"v":"Предлагает всё бросить и пойти повеселиться","a":"Вечный ребёнок"},{"v":"Шутит, пока друг не улыбнётся","a":"Шутник-клоун"}]}],"animals":[{"q":"Он очень проголодался, а еды рядом нет. Что он сделает?","o":[{"v":"Носится туда-сюда в поисках хоть крошки","a":"Непоседа"},{"v":"Ждёт, пока еду найдёт кто-то другой, и незаметно утаскивает её","a":"Хитрюга"},{"v":"Падает без сил: «Всё, я умираю от голода!»","a":"Королева драмы"},{"v":"Мечтает о самом вкусном обеде на свете","a":"Мечтатель"},{"v":"Ищет и не сдаётся, пока не найдёт","a":"Упрямец"},{"v":"Ворчит на весь свет, но ищет еду и для других","a":"Ворчун с добрым сердцем"},{"v":"Засыпает: во сне голод не чувствуется","a":"Лентяй-соня"},{"v":"Отправляется искать еду в незнакомые места","a":"Исследователь"}]},{"q":"Он нашёл что-то незнакомое и блестящее. Что он сделает?","o":[{"v":"Тащит находку всем: «Смотрите, что у меня!»","a":"Хвастун"},{"v":"Пробует на зуб: вдруг это съедобно","a":"Обжора-гурман"},{"v":"Устраивает с находкой смешное представление","a":"Шутник-клоун"},{"v":"Робко разглядывает её издалека и не решается подойти","a":"Тихоня-скромняга"},{"v":"Играет с ней без остановки","a":"Вечный ребёнок"},{"v":"Подозрительно разглядывает со всех сторон: здесь точно какой-то подвох","a":"Скептик-зануда"},{"v":"Утаскивает к себе в запасы","a":"Жадина-скряга"},{"v":"Любуется, как красиво она блестит","a":"Эстет"}]},{"q":"Рядом собралось много других обитателей. Что он делает?","o":[{"v":"Узнаёт у всех новости и разносит их дальше","a":"Болтун-сплетник"},{"v":"Сначала прячется, потом осторожно выходит знакомиться","a":"Трусишка-храбрец"},{"v":"Суетится и следит, чтобы всем хватило места","a":"Хлопотун"},{"v":"Красуется перед тем, кто ему понравился","a":"Романтик"},{"v":"Встаёт впереди и ведёт всех за собой","a":"Командир"},{"v":"Прихорашивается, чтобы выглядеть лучше всех","a":"Модник"},{"v":"Затевает общую игру и тормошит всех вокруг","a":"Энтузиаст"},{"v":"Сидит в стороне и размышляет, откуда все взялись","a":"Философ"}]},{"q":"Вдруг рядом появился кто-то большой и страшный. Что он делает?","o":[{"v":"Бросается прятаться и натыкается на всё подряд","a":"Растяпа"},{"v":"«Это конец! Нас сейчас съедят!»","a":"Паникёр"},{"v":"Первым делом зовёт всех спрятаться","a":"Заботливый"},{"v":"«А вдруг он просто хочет подружиться?»","a":"Наивный оптимист"},{"v":"Прячется идеально, чтобы не было видно даже кончика хвоста","a":"Перфекционист"},{"v":"Назло выходит вперёд и корчит рожицы","a":"Бунтарь"},{"v":"На ходу мастерит хитрую ловушку из того, что есть рядом","a":"Изобретатель"},{"v":"Подкрадывается поближе, чтобы выяснить, кто это и зачем пришёл","a":"Сыщик"}]},{"q":"Кто-то занял его любимое место. Как он реагирует?","o":[{"v":"Долго объясняет чужаку, почему это место по праву его","a":"Всезнайка"},{"v":"Уступает: «Пусть ему будет удобно»","a":"Альтруист"},{"v":"Узнаёт друга, радостно подвигается и устраивается рядом","a":"Верный друг"},{"v":"«Это моё место! Уходи!»","a":"Ревнивец-собственник"},{"v":"Задумывает коварный план выжить чужака, но сам попадает впросак","a":"Злодей-неудачник"},{"v":"Спокойно находит другое место: хорошо везде","a":"Мудрец"},{"v":"Решает, что чужаку нужна помощь, и бросается его опекать","a":"Спасатель-герой"},{"v":"Отвлекает чужака и тут же занимает место обратно","a":"Хитрюга"}]}],"flora":[{"q":"Давно не было дождя, и ему очень хочется пить. Что он делает?","o":[{"v":"Вертится во все стороны, высматривая хоть каплю воды","a":"Непоседа"},{"v":"Незаметно тянется к соседской лужице","a":"Хитрюга"},{"v":"Картинно никнет: «Я засыхаю! Прощайте все!»","a":"Королева драмы"},{"v":"Мечтает о тёплом летнем ливне и улыбается","a":"Мечтатель"},{"v":"Стоит прямо и не сдаётся: «Я ещё всех переживу!»","a":"Упрямец"},{"v":"Ворчит на солнце и тучи, но укрывает соседа своей тенью","a":"Ворчун с добрым сердцем"},{"v":"Сворачивается и засыпает до самого дождя","a":"Лентяй-соня"},{"v":"Мастерит из того, что рядом, воронку, чтобы ловить росу","a":"Изобретатель"}]},{"q":"Рядом вырос новый сосед. Как он реагирует?","o":[{"v":"Выпрямляется во весь рост: «Смотри, какой я большой и красивый!»","a":"Хвастун"},{"v":"Первым делом спрашивает, вкусная ли у соседа земля","a":"Обжора-гурман"},{"v":"Щекочет соседа травинкой и смешит его","a":"Шутник-клоун"},{"v":"Смущается и старается казаться незаметным","a":"Тихоня-скромняга"},{"v":"Зовёт соседа играть в догонялки с ветром","a":"Вечный ребёнок"},{"v":"Подозрительно присматривается: «Ты вообще отсюда?»","a":"Скептик-зануда"},{"v":"Тут же рассказывает ему все местные новости","a":"Болтун-сплетник"},{"v":"Оценивает, красиво ли они смотрятся рядом","a":"Эстет"}]},{"q":"Кто-то тянется, чтобы его сорвать. Что он делает?","o":[{"v":"Трясётся всем телом: «Всё, это конец!»","a":"Паникёр"},{"v":"Сначала дрожит, а потом смело выпрямляется","a":"Трусишка-храбрец"},{"v":"Закрывает собой маленьких соседей","a":"Заботливый"},{"v":"Корчит рожицу и ни за что не даётся","a":"Бунтарь"},{"v":"«Не трогай! Я сам свой собственный!»","a":"Ревнивец-собственник"},{"v":"Задумывает обрызгать обидчика, но обрызгивает сам себя","a":"Злодей-неудачник"},{"v":"Отвлекает внимание на себя, чтобы спасти соседей","a":"Спасатель-герой"},{"v":"Внимательно разглядывает, кто это и зачем он ему понадобился","a":"Сыщик"}]},{"q":"Утром он заметил, что за ночь вырос в два раза. Что он делает?","o":[{"v":"«Ура! Давайте расти ещё!»","a":"Энтузиаст"},{"v":"Осматривается: что видно с новой высоты?","a":"Исследователь"},{"v":"Задумывается: «А где мой предел?»","a":"Философ"},{"v":"Сразу проверяет, идёт ли ему новый рост","a":"Модник"},{"v":"Раз теперь он самый высокий, значит, главный","a":"Командир"},{"v":"Тянется повыше, чтобы увидеть закат","a":"Романтик"},{"v":"«Значит, скоро дотянусь до солнца!»","a":"Наивный оптимист"},{"v":"Расстраивается: одна сторона выросла кривее другой","a":"Перфекционист"}]},{"q":"Налетел сильный ветер. Что он делает?","o":[{"v":"Путается сам в себе и чуть не падает","a":"Растяпа"},{"v":"Подставляет себя ветру, чтобы укрыть соседей","a":"Альтруист"},{"v":"Держится поближе к другу, чтобы устоять вместе","a":"Верный друг"},{"v":"Суетится и проверяет, все ли соседи на месте","a":"Хлопотун"},{"v":"Объясняет всем, откуда дует ветер и как правильно гнуться","a":"Всезнайка"},{"v":"Спокойно склоняется: «Ветер пройдёт, а мы останемся»","a":"Мудрец"},{"v":"Крепко держится за свою землю: «Не отдам ни крупинки!»","a":"Жадина-скряга"},{"v":"Покачивается на ветру, будто танцует, и всех смешит","a":"Шутник-клоун"}]}],"fairy":[{"q":"Его позвали на сказочный пир. Что он делает?","o":[{"v":"Пробует каждое блюдо и просит добавки","a":"Обжора-гурман"},{"v":"Рассказывает всем о подвигах, которых не было","a":"Хвастун"},{"v":"Узнаёт все сказочные сплетни и разносит их дальше","a":"Болтун-сплетник"},{"v":"Полдня выбирает наряд и приходит последним","a":"Модник"},{"v":"Высматривает, кого пригласить на танец","a":"Романтик"},{"v":"Рассаживает гостей и командует, когда подавать блюда","a":"Командир"},{"v":"Помогает накрывать на стол и всех угощает","a":"Хлопотун"},{"v":"Первым пускается в пляс и тянет за собой остальных","a":"Энтузиаст"}]},{"q":"Он нашёл волшебный клубочек, который куда-то катится. Что он сделает?","o":[{"v":"Тут же мчится за ним вприпрыжку","a":"Непоседа"},{"v":"Идёт следом: интересно, куда приведёт","a":"Исследователь"},{"v":"Сначала боится, потом решается и идёт","a":"Трусишка-храбрец"},{"v":"Садится на клубочек верхом, чтобы не идти пешком","a":"Лентяй-соня"},{"v":"«Волшебных клубков не бывает», но всё равно идёт следом","a":"Скептик-зануда"},{"v":"Прячет клубочек подальше: пригодится","a":"Жадина-скряга"},{"v":"Выясняет, кто его подбросил и зачем","a":"Сыщик"},{"v":"Представляет, что клубок ведёт его к счастью","a":"Мечтатель"}]},{"q":"Говорящая щука обещает исполнить одно его желание. Что он загадает?","o":[{"v":"Хитро просит, чтобы желаний стало сто","a":"Хитрюга"},{"v":"Гору игрушек и сладостей","a":"Вечный ребёнок"},{"v":"Желание для кого-то другого","a":"Альтруист"},{"v":"Власть над всем лесом, но всё сразу идёт наперекосяк","a":"Злодей-неудачник"},{"v":"Ничего, отпускает щуку: «У меня и так всё есть»","a":"Мудрец"},{"v":"Долго думает, чего же он на самом деле хочет","a":"Философ"},{"v":"Чтобы всё самое лучшее было только его","a":"Ревнивец-собственник"},{"v":"Рыдает от счастья и никак не может выбрать","a":"Королева драмы"}]},{"q":"В его сказку забрёл обычный человек с телефоном. Что он делает?","o":[{"v":"Объясняет гостю, как правильно жить в сказке","a":"Всезнайка"},{"v":"Корчит смешные рожицы в камеру","a":"Шутник-клоун"},{"v":"Разбирает телефон, чтобы понять, как он устроен","a":"Изобретатель"},{"v":"«Чудище! Спасайся кто может!»","a":"Паникёр"},{"v":"Прячется и тайком подглядывает","a":"Тихоня-скромняга"},{"v":"Ворчит «ходят тут всякие», но угощает гостя","a":"Ворчун с добрым сердцем"},{"v":"Радуется: «Наконец-то новый друг!»","a":"Наивный оптимист"},{"v":"Ужасается, как странно гость одет","a":"Эстет"}]},{"q":"Ночью он заблудился в дремучем лесу. Что он делает?","o":[{"v":"Спотыкается о каждый корень и теряет шапку","a":"Растяпа"},{"v":"Зажигает огонёк, чтобы другим заблудившимся было видно дорогу","a":"Заботливый"},{"v":"Ищет того, кто тоже заблудился, чтобы идти вместе","a":"Верный друг"},{"v":"Строит себе идеальный шалаш до утра","a":"Перфекционист"},{"v":"Идёт напролом, никуда не сворачивая","a":"Упрямец"},{"v":"Назло всем страшилкам громко поёт","a":"Бунтарь"},{"v":"Слышит чей-то плач и бросается на помощь","a":"Спасатель-герой"},{"v":"Ложится спать: утро вечера мудренее","a":"Лентяй-соня"}]}],"monster":[{"q":"Его совсем никто не боится. Что он делает?","o":[{"v":"Рыдает: «Я самый несчастный монстр на свете!»","a":"Королева драмы"},{"v":"Пугает снова и снова, пока не получится","a":"Упрямец"},{"v":"Мастерит страшный костюм из того, что попалось под руку","a":"Изобретатель"},{"v":"Прячется и выскакивает в самый неожиданный момент","a":"Хитрюга"},{"v":"«Зато со мной все хотят дружить!»","a":"Наивный оптимист"},{"v":"Задумывается: «А зачем вообще пугать?»","a":"Философ"},{"v":"Ворчит: «Раньше монстров уважали!»","a":"Ворчун с добрым сердцем"},{"v":"Рассказывает, каким ужасным он был в молодости","a":"Хвастун"}]},{"q":"Вдруг включили яркий свет! Что он делает?","o":[{"v":"Вопит и мечется туда-сюда","a":"Паникёр"},{"v":"Ныряет в укрытие и застревает","a":"Растяпа"},{"v":"«Ой, я же не причёсан!» и срочно приводит себя в порядок","a":"Модник"},{"v":"Сжимается в комочек, чтобы его не заметили","a":"Тихоня-скромняга"},{"v":"Натягивает одеяло на голову и спит дальше","a":"Лентяй-соня"},{"v":"Выясняет, кто включил свет и зачем","a":"Сыщик"},{"v":"Назло всем стоит на свету и щурится","a":"Бунтарь"},{"v":"Впервые разглядывает, как всё выглядит при свете","a":"Исследователь"}]},{"q":"Ребёнок не испугался, а позвал его играть. Как он реагирует?","o":[{"v":"Забывает, что он страшный, и играет до утра","a":"Вечный ребёнок"},{"v":"С этого дня становится его лучшим другом","a":"Верный друг"},{"v":"Подозревает, что это ловушка","a":"Скептик-зануда"},{"v":"Задумывает напугать его в разгар игры, но так увлекается, что забывает","a":"Злодей-неудачник"},{"v":"Следит, чтобы ребёнок не замёрз и вовремя лёг спать","a":"Заботливый"},{"v":"Корчит смешные рожицы, и ребёнок хохочет","a":"Шутник-клоун"},{"v":"Придумывает сразу десять новых игр","a":"Энтузиаст"},{"v":"Отдаёт ребёнку все свои сокровища","a":"Альтруист"}]},{"q":"Собрался ночной слёт всех монстриков. Что он там делает?","o":[{"v":"Собирает все страшилки и пересказывает их каждому","a":"Болтун-сплетник"},{"v":"Строит монстров в шеренгу и раздаёт задания","a":"Командир"},{"v":"Не отходит от стола с угощениями","a":"Обжора-гурман"},{"v":"Весь вечер не сводит глаз с одной симпатичной страшилки","a":"Романтик"},{"v":"Следит, чтобы всем хватило паутины и угощений","a":"Хлопотун"},{"v":"Критикует, как безвкусно украшен зал","a":"Эстет"},{"v":"Даёт молодым монстрикам мудрые советы","a":"Мудрец"},{"v":"Репетирует своё «Бу!», пока оно не станет идеальным","a":"Перфекционист"}]},{"q":"Ночью он услышал странный шорох. Что он делает?","o":[{"v":"Сначала прячется, потом смело идёт проверить","a":"Трусишка-храбрец"},{"v":"Носится по всему дому и заглядывает в каждый угол","a":"Непоседа"},{"v":"Объясняет всем, что это просто ветер","a":"Всезнайка"},{"v":"Представляет, что это пришёл новый друг","a":"Мечтатель"},{"v":"Первым делом проверяет, на месте ли его сокровища","a":"Жадина-скряга"},{"v":"«Кто это шуршит в МОЁМ углу?!»","a":"Ревнивец-собственник"},{"v":"Мчится спасать всех от неизвестной опасности","a":"Спасатель-герой"},{"v":"«Тут кто-то страшнее меня! Спасите!»","a":"Паникёр"}]}],"space":[{"q":"Его корабль сломался на Земле. Что он делает?","o":[{"v":"Чинит корабль тем, что нашёл на свалке","a":"Изобретатель"},{"v":"«Я застрял здесь навсегда!»","a":"Паникёр"},{"v":"Пытается починить и откручивает ещё одну деталь","a":"Растяпа"},{"v":"Чинит день и ночь, пока не заработает","a":"Упрямец"},{"v":"Ложится в траву: «Ну и ладно, тут тоже неплохо»","a":"Лентяй-соня"},{"v":"Рыдает и шлёт в космос сигнал SOS на всех частотах","a":"Королева драмы"},{"v":"«Отлично, значит, у меня каникулы на Земле!»","a":"Наивный оптимист"},{"v":"Тут же назначает местных жуков своими помощниками","a":"Командир"}]},{"q":"Его заметили люди. Как он реагирует?","o":[{"v":"Притворяется уличным фонарём","a":"Тихоня-скромняга"},{"v":"«Я великий посол далёкой галактики!»","a":"Хвастун"},{"v":"Показывает людям смешные инопланетные фокусы","a":"Шутник-клоун"},{"v":"Подозревает, что на самом деле пришельцы — это люди","a":"Скептик-зануда"},{"v":"Делает вид, что он просто человек в костюме","a":"Хитрюга"},{"v":"Сначала прячется, потом решается помахать","a":"Трусишка-храбрец"},{"v":"Срочно меняет цвет, чтобы произвести впечатление","a":"Модник"},{"v":"«Я пришёл захватить вашу планету!», а люди умиляются","a":"Злодей-неудачник"}]},{"q":"Он впервые попробовал земную еду. Что он делает?","o":[{"v":"Съедает всё и просит рецепт","a":"Обжора-гурман"},{"v":"Восхищается, как красиво уложен салат","a":"Эстет"},{"v":"Записывает в журнал вкус каждой крошки","a":"Исследователь"},{"v":"Набивает карманы едой про запас для полёта","a":"Жадина-скряга"},{"v":"Ест строго по порядку, по одной горошинке","a":"Перфекционист"},{"v":"Выясняет, из чего сделана загадочная котлета","a":"Сыщик"},{"v":"Ворчит, что дома еда вкуснее, но берёт добавку","a":"Ворчун с добрым сердцем"},{"v":"Играет с едой и строит из неё ракету","a":"Вечный ребёнок"}]},{"q":"Он попал на земной день рождения. Что он делает?","o":[{"v":"Рассказывает всем гостям, как празднуют на его планете","a":"Болтун-сплетник"},{"v":"Первым кричит «Ура!» и тянет всех танцевать","a":"Энтузиаст"},{"v":"Растроган до слёз, когда все поют песню","a":"Романтик"},{"v":"Бегает с тарелками и всех угощает","a":"Хлопотун"},{"v":"Носится между гостями и лопает все шарики","a":"Непоседа"},{"v":"Задувает свечи на чужом торте","a":"Бунтарь"},{"v":"«А зачем люди считают свои годы?»","a":"Философ"},{"v":"Отдаёт свой кусок торта тому, кому не досталось","a":"Альтруист"}]},{"q":"Пришло сообщение: пора возвращаться домой. Что он делает?","o":[{"v":"Не улетит без своих земных друзей","a":"Верный друг"},{"v":"Спокойно прощается: «Мы ещё встретимся»","a":"Мудрец"},{"v":"Оставляет всем подарки и подсказки, как жить без него","a":"Заботливый"},{"v":"Хочет забрать всё, что полюбил на Земле: «Это теперь моё!»","a":"Ревнивец-собственник"},{"v":"Решает остаться, пока не спасёт Землю от всех бед","a":"Спасатель-герой"},{"v":"Перед отлётом читает людям лекцию, как жить правильно","a":"Всезнайка"},{"v":"Улетает и мечтает когда-нибудь вернуться","a":"Мечтатель"},{"v":"Устраивает прощание со слезами на всю галактику","a":"Королева драмы"}]}],"food":[{"q":"К нему тянется чья-то рука с вилкой. Что он делает?","o":[{"v":"«Помогите! Меня сейчас съедят!»","a":"Паникёр"},{"v":"Прячется за соседа и подставляет его","a":"Хитрюга"},{"v":"Зажмуривается, а потом смело выпрямляется: «Ну, попробуй!»","a":"Трусишка-храбрец"},{"v":"Картинно падает: «Прощайте, друзья, я был вкусным!»","a":"Королева драмы"},{"v":"Назло всем отпрыгивает с тарелки","a":"Бунтарь"},{"v":"«Ура, меня выбрали, значит, я самый вкусный!»","a":"Наивный оптимист"},{"v":"Закрывает собой маленькую ягодку","a":"Спасатель-герой"},{"v":"Не шевелится: может, решат, что он невкусный","a":"Лентяй-соня"}]},{"q":"Его забыли на столе на всю ночь. Чем он займётся?","o":[{"v":"Скачет по всему столу","a":"Непоседа"},{"v":"Обходит кухню и заглядывает во все шкафчики","a":"Исследователь"},{"v":"Смотрит в окно на луну и мечтает","a":"Мечтатель"},{"v":"Строит из ложек и салфеток домик","a":"Изобретатель"},{"v":"Болтает со всеми продуктами до утра","a":"Болтун-сплетник"},{"v":"Катается с тарелки, как с горки","a":"Вечный ребёнок"},{"v":"«Зачем я здесь, если меня никто не ест?»","a":"Философ"},{"v":"Ворчит, что заветривается, но укрывает соседей салфеткой","a":"Ворчун с добрым сердцем"}]},{"q":"В холодильнике появился новый заморский продукт. Как он реагирует?","o":[{"v":"«Заморский? Наверняка невкусный»","a":"Скептик-зануда"},{"v":"«Это моя полка, двигайся!»","a":"Ревнивец-собственник"},{"v":"Восхищается его необычной упаковкой","a":"Эстет"},{"v":"Влюбляется с первого взгляда","a":"Романтик"},{"v":"Сразу объясняет новичку правила холодильника","a":"Командир"},{"v":"Уступает ему самое прохладное место","a":"Альтруист"},{"v":"«Зато меня все любят больше!»","a":"Хвастун"},{"v":"Читает его этикетку, чтобы узнать все тайны","a":"Сыщик"}]},{"q":"Его выбрали главным блюдом на праздник. Что он делает?","o":[{"v":"Час прихорашивается перед подачей","a":"Модник"},{"v":"Проверяет, чтобы каждая крошка лежала идеально","a":"Перфекционист"},{"v":"«Ура! Это мой звёздный час!»","a":"Энтузиаст"},{"v":"Краснеет и хочет спрятаться под салфетку","a":"Тихоня-скромняга"},{"v":"«А что мне за это будет?»","a":"Жадина-скряга"},{"v":"Задумывает затмить торт, но сам падает в салат","a":"Злодей-неудачник"},{"v":"Сам облизывается, глядя на остальные блюда","a":"Обжора-гурман"},{"v":"Строит рожицы, и гости хохочут","a":"Шутник-клоун"}]},{"q":"На кухне переполох: готовят большой обед. Что он делает?","o":[{"v":"Скатывается со стола прямо в кастрюлю","a":"Растяпа"},{"v":"Следит, чтобы никого из друзей не пересолили","a":"Заботливый"},{"v":"Помогает расставлять тарелки и суетится больше повара","a":"Хлопотун"},{"v":"Держится рядом с другом, чтобы попасть в одно блюдо","a":"Верный друг"},{"v":"Подсказывает повару, как правильно готовить","a":"Всезнайка"},{"v":"Спокойно ждёт: всему своё время","a":"Мудрец"},{"v":"Ни за что не лезет в кастрюлю, пока не сварят по его рецепту","a":"Упрямец"},{"v":"Мечтает попасть в самое красивое блюдо","a":"Мечтатель"}]}],"things":[{"q":"Ночью все уснули, и он ожил. Что он делает первым делом?","o":[{"v":"Носится по всем углам, пока все спят","a":"Непоседа"},{"v":"Ищет, чем бы перекусить","a":"Обжора-гурман"},{"v":"Потягивается и засыпает обратно","a":"Лентяй-соня"},{"v":"Отправляется осмотреть, что вокруг","a":"Исследователь"},{"v":"Готовит к утру смешной сюрприз","a":"Шутник-клоун"},{"v":"Мастерит что-то из всего, что найдёт рядом","a":"Изобретатель"},{"v":"Смотрит на звёзды и мечтает о путешествиях","a":"Мечтатель"},{"v":"Будит всех остальных и раздаёт задания","a":"Командир"}]},{"q":"Рядом появился новенький: такой же, как он, только новый и блестящий. Как он реагирует?","o":[{"v":"«Это моё место, а не твоё!»","a":"Ревнивец-собственник"},{"v":"«Зато я опытнее, я тут всё повидал!»","a":"Хвастун"},{"v":"Срочно начищает себя до блеска","a":"Модник"},{"v":"«Блестит-то блестит, но надолго ли?»","a":"Скептик-зануда"},{"v":"Уступает новенькому лучшее место","a":"Альтруист"},{"v":"Рассказывает ему все местные новости","a":"Болтун-сплетник"},{"v":"Задумывает от него избавиться, но план тут же проваливается","a":"Злодей-неудачник"},{"v":"Смущённо отходит в сторонку","a":"Тихоня-скромняга"}]},{"q":"Его позвали сниматься в рекламе. Что он делает?","o":[{"v":"Требует гримёра и личную гримёрку","a":"Королева драмы"},{"v":"«Конечно! Когда начинаем?!»","a":"Энтузиаст"},{"v":"Сначала прячется от камеры, потом смело выходит","a":"Трусишка-храбрец"},{"v":"Репетирует, пока дубль не станет идеальным","a":"Перфекционист"},{"v":"Делает всё не по сценарию","a":"Бунтарь"},{"v":"Критикует свет и декорации","a":"Эстет"},{"v":"Первым делом спрашивает, сколько заплатят","a":"Жадина-скряга"},{"v":"Корчит рожицы в камеру и веселится","a":"Вечный ребёнок"}]},{"q":"Его уже давно никто не замечает. Что он делает?","o":[{"v":"Устраивает хитрый трюк, чтобы все обратили на него внимание","a":"Хитрюга"},{"v":"«Меня забыли навсегда!»","a":"Паникёр"},{"v":"Пытается привлечь внимание и с грохотом что-то роняет","a":"Растяпа"},{"v":"«Зато можно спокойно отдохнуть!»","a":"Наивный оптимист"},{"v":"Стоит на самом видном месте, пока не заметят","a":"Упрямец"},{"v":"Ворчит «никому я не нужен», но тайком следит за всеми","a":"Ворчун с добрым сердцем"},{"v":"«Если меня никто не видит, я вообще есть?»","a":"Философ"},{"v":"Выясняет, куда все подевались","a":"Сыщик"}]},{"q":"Он нашёл записку: «Завтра тебя ждёт большое приключение». Что он делает?","o":[{"v":"Беспокоится, как без него справятся остальные","a":"Заботливый"},{"v":"Собирает припасы в дорогу на всех","a":"Хлопотун"},{"v":"Надеется, что в приключении встретит свою любовь","a":"Романтик"},{"v":"Спокойно ждёт утра: что будет, то будет","a":"Мудрец"},{"v":"Готовится спасать мир","a":"Спасатель-герой"},{"v":"Объясняет всем, как правильно готовиться к приключениям","a":"Всезнайка"},{"v":"Бежит звать с собой лучшего друга","a":"Верный друг"},{"v":"«А можно это приключение без меня?»","a":"Лентяй-соня"}]}],"micro":[{"q":"Его заметили под микроскопом. Что он делает?","o":[{"v":"Срочно прихорашивается: его же увидят!","a":"Модник"},{"v":"Прячется за соседей","a":"Тихоня-скромняга"},{"v":"Позирует: «Смотрите, какой я важный!»","a":"Хвастун"},{"v":"«За мной следят! Спасайтесь!»","a":"Паникёр"},{"v":"Корчит рожицы прямо в объектив","a":"Шутник-клоун"},{"v":"Сам разглядывает огромный глаз учёного","a":"Исследователь"},{"v":"«Не верю, что там вообще кто-то есть»","a":"Скептик-зануда"},{"v":"Падает в обморок от всеобщего внимания","a":"Королева драмы"}]},{"q":"Вокруг вдруг стало очень холодно. Что он делает?","o":[{"v":"Сворачивается клубочком и засыпает","a":"Лентяй-соня"},{"v":"Собирает всех поближе, чтобы согреться","a":"Заботливый"},{"v":"Суетится и укутывает каждого","a":"Хлопотун"},{"v":"Ворчит, что замёрз, но греет соседа","a":"Ворчун с добрым сердцем"},{"v":"«Не замёрзну, и всё!»","a":"Упрямец"},{"v":"Мастерит обогреватель из того, что рядом","a":"Изобретатель"},{"v":"«Зато можно покататься, как на катке!»","a":"Наивный оптимист"},{"v":"Поскальзывается и катится кубарем","a":"Растяпа"}]},{"q":"Вокруг миллион таких же, как он. Что он делает?","o":[{"v":"Строит всех в ровные ряды","a":"Командир"},{"v":"Успевает поболтать с каждым","a":"Болтун-сплетник"},{"v":"Делает всё не так, как остальные, чтобы выделиться","a":"Бунтарь"},{"v":"Зовёт всех на общее дело","a":"Энтузиаст"},{"v":"«Я тут первый был!»","a":"Ревнивец-собственник"},{"v":"Устраивает со всеми игру в догонялки","a":"Вечный ребёнок"},{"v":"«Если нас так много, то кто из нас я?»","a":"Философ"},{"v":"Ищет в толпе того самого, единственного","a":"Романтик"}]},{"q":"Ему поручили очень важное задание. Что он делает?","o":[{"v":"Готовится, пока всё не будет идеально","a":"Перфекционист"},{"v":"Придумывает, как выполнить задание и не устать","a":"Хитрюга"},{"v":"Сначала дрожит, потом смело берётся за дело","a":"Трусишка-храбрец"},{"v":"«Наконец-то подвиг!»","a":"Спасатель-герой"},{"v":"Решает сделать всё по-своему, и всё идёт кувырком","a":"Злодей-неудачник"},{"v":"Сначала выясняет все подробности","a":"Сыщик"},{"v":"«А что я за это получу?»","a":"Жадина-скряга"},{"v":"Срывается с места, не дослушав","a":"Непоседа"}]},{"q":"Вдруг всё вокруг затряслось. Что он делает?","o":[{"v":"Хватается за друга: держимся вместе","a":"Верный друг"},{"v":"Спокойно ждёт: всё пройдёт","a":"Мудрец"},{"v":"Пропускает в укрытие всех остальных","a":"Альтруист"},{"v":"Объясняет, что это просто кто-то чихнул","a":"Всезнайка"},{"v":"Представляет, что катается на волнах","a":"Мечтатель"},{"v":"Крепко держит свой обед, чтобы не потерять","a":"Обжора-гурман"},{"v":"Переживает, что вокруг всё перепутается","a":"Эстет"},{"v":"«Землетрясение! Это конец!»","a":"Паникёр"}]}],"elements":[{"q":"Его унесло далеко от привычного места. Что он делает?","o":[{"v":"С восторгом осматривает новые места","a":"Исследователь"},{"v":"«Я потерялся навсегда!»","a":"Паникёр"},{"v":"Плывёт, куда несёт, и мечтает","a":"Мечтатель"},{"v":"Пробивается обратно против ветра","a":"Упрямец"},{"v":"Не сопротивляется: пусть несёт","a":"Лентяй-соня"},{"v":"«Ура, путешествие!»","a":"Наивный оптимист"},{"v":"Натыкается на всё на своём пути","a":"Растяпа"},{"v":"Придумывает, как вернуться самым быстрым путём","a":"Изобретатель"}]},{"q":"Его никто не замечает. Как он реагирует?","o":[{"v":"Обиженно тускнеет: «Вот так всегда!»","a":"Королева драмы"},{"v":"Устраивает яркий трюк, чтобы все обернулись","a":"Хитрюга"},{"v":"Принимает смешную форму, чтобы все улыбнулись","a":"Шутник-клоун"},{"v":"«Может, быть незаметным — это тоже хорошо?»","a":"Философ"},{"v":"Тихо радуется, что можно побыть одному","a":"Тихоня-скромняга"},{"v":"Ворчит, но продолжает делать своё дело для всех","a":"Ворчун с /* ===== Сюжетометр ===== */
function analyze(t,p){
  const low=' '+t.toLowerCase().replace(/ё/g,'е')+' ';
  const sentences=t.split(/[.!?…]+/).map(s=>s.trim()).filter(s=>s.length>3);
  const words=(t.match(/[а-яёa-z-]+/gi)||[]);
  const names=p.heroes.map(h=>(h.name||'').trim().toLowerCase().replace(/ё/g,'е').slice(0,Math.max(3,(h.name||'').length-2))).filter(n=>n.length>=3);
  const heroHits=names.reduce((n,nm)=>n+(low.split(nm).length-1),0)+(low.match(/геро[йяи]/g)||[]).length;
  const verbs=words.filter(w=>/(ет|ит|ут|ют|ат|ят|ется|ится|ался|ался|ила|ала|ела|ыла|ил|ал|ел|ыл|ает|яет|ует)$/i.test(w)&&w.length>3).length;
  const turns=(low.match(/ но |вдруг|внезапно|оказыва|неожиданн|однако|зато|а тут|но тут/g)||[]).length;
  const C=[
   {k:'Герой',w:10,ok:heroHits>0||/[^.!?\s]\s+[А-ЯЁ][а-яё]{2,}/.test(t),fix:'Назови героя по имени — зрителю нужен «свой» персонаж.'},
   {k:'Цель',w:12,ok:/(хочет|мечта|собира|пыта|нужно|надо|планир|решает|старает|ищет|готовит|спешит|ждет)/.test(low),fix:'Добавь, чего герой хочет: «Марина хочет успеть…»'},
   {k:'Препятствие',w:14,ok:/( но |меша|не может|не получ|слома|ломает|теря|боит|страш|опазд|не успе|проблем|никто не|закрыт|исчез)/.test(low),fix:'Добавь, что мешает герою. Без «но» история плоская.'},
   {k:'Поворот',w:14,ok:turns>0,fix:'Нужен поворот: «вдруг», «оказывается», неожиданное решение.'},
   {k:'Действия',w:10,ok:verbs>=4,fix:'Больше действий: что герой делает руками, куда идёт, что хватает.'},
   {k:'События',w:10,ok:sentences.length>=3,fix:'Разложи историю на 3+ события: начало, помеха, развязка.'},
   {k:'Эмоция',w:10,ok:/(рад|смех|смеет|улыб|плач|груст|страх|удив|восторг|нежн|счаст|злит|злость|обид|облегч|горд|тепл|смущ|ужас|паник)/.test(low),fix:'Покажи, что герой чувствует: улыбается, пугается, облегчённо выдыхает.'},
   {k:'Финал',w:12,ok:/(в итоге|в конце|в финале|наконец|заканчива|оказывается|теперь|с тех пор)/.test(low),fix:'Чётко закончи историю: «В итоге…», «Наконец…».'},
   {k:'Плотность',w:8,ok:words.length>=25&&words.length<=140,fix:words.length<25?'Историю пока сложно понять — допиши 2–3 предложения.':'Слишком длинно для 15–30 секунд — сократи до главного.'}
  ];
  const score=t.trim()?C.reduce((s,x)=>s+(x.ok?x.w:0),0):0;
  return {score,C,tiles:[['Герои',heroHits],['Действия',verbs],['Повороты / «но»',turns],['События / сцены',sentences.length]],empty:!t.trim()};
}
function scoreHTML(r){
  if(r.empty)return `<div class="empty">Вставь историю — здесь появится оценка</div>`;
  const col=r.score>=80?'var(--lime)':r.score>=55?'var(--sun)':'var(--pink)';
  const good=r.C.filter(x=>x.ok),bad=r.C.filter(x=>!x.ok).sort((a,b)=>b.w-a.w).slice(0,3);
  return `<div class="score"><div class="big">${r.score}<span style="font-size:20px"> / 100</span></div><div class="meter" role="img" aria-label="Оценка ${r.score} из 100"><i style="width:${r.score}%;background:${col}"></i></div><b>${r.score>=80?'Можно снимать 🎬':r.score>=55?'Почти готово':'Нужно докрутить'}</b></div>
  <div class="tiles">${r.tiles.map(([k,n])=>`<div class="tile"><b>${n}</b><span>${k}</span></div>`).join('')}</div>
  <div class="checks"><div><span class="qlabel">✅ Что уже работает</span><ul>${good.map(x=>`<li>${x.k}</li>`).join('')||'<li>Пока ничего</li>'}</ul></div>
  <div><span class="qlabel">✏️ Что поправить</span><ul id="fixes">${bad.map(x=>`<li>${x.fix}</li>`).join('')||'<li>Всё на месте!</li>'}</ul>${bad.length?`<button class="btn small" style="margin-top:8px" data-a="takeFixes">Записать в заметки ↓</button>`:''}</div></div>`;
}

  if(b==='pname')p.name=val;else if(b==='pnote')p.note=val;
  else if(b==='vtitle'){cx.v.title=val;cx.v.updated=today()}
  else if(b==='iname'){cx.x.name=val;refreshOut()}
  else if(b==='text'){cx.d.text=val;cx.v.updated=today();markStep()}
  else if(b.startsWith('c:')){cx.c[b.slice(2)]=val;if(cx.v)cx.v.updated=today();delete cx.c['_auto.'+b.slice(2).replace(/Own$/,'')];refreshOut()}
  const sv=document.getElementById('saved');if(sv)sv.textContent='Сохраняю…';save();
}
document.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onInput(e)});

function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function setResult(text){const el=document.getElementById('f-text');el.value=text;el.dispatchEvent(new Event('input',{bubbles:true}));el.scrollIntoView({behavior:'smooth',block:'center'})}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;const p=P();
  if(a!=='ask'&&a!=='noconfirm')V.confirm=null;
  switch(a){
    case 'home':go({screen:'projects'});break;
    case 'openP':go({screen:'project',pid:id||V.pid,tab:'videos'});break;
    case 'lib':go({screen:'project',pid:V.pid,tab:'lib'});break;
    case 'tab':V.tab=id;render();break;
    case 'newP':{const np={id:uid(),name:'Новый заказчик',note:'',color:COLORS[S.projects.length%COLORS.length],created:today(),heroes:[],locations:[],videos:[],fresh:true};S.projects.push(np);go({screen:'project',pid:np.id,tab:'lib'});setTimeout(()=>{const i=document.getElementById('pname');i&&i.select()},50);break}
    case 'newV':{const v={id:uid(),title:'',updated:today(),steps:{}};p.videos.unshift(v);go({screen:'video',pid:p.id,vid:v.id,step:0});setTimeout(()=>document.getElementById('vtitle')?.focus(),50);break}
    case 'openV':go({screen:'video',pid:p.id,vid:id});break;
    case 'step':V.step=+id;render();window.scrollTo(0,0);break;
    case 'newH':{const x={id:uid(),name:'',c:{}};p.heroes.push(x);go({screen:'hero',pid:p.id,iid:x.id});setTimeout(()=>document.getElementById('iname')?.focus(),50);break}
    case 'newL':{const x={id:uid(),name:'',c:{}};p.locations.push(x);go({screen:'loc',pid:p.id,iid:x.id});setTimeout(()=>document.getElementById('iname')?.focus(),50);break}
    case 'openH':go({screen:'hero',pid:p.id,iid:id});break;
    case 'openL':go({screen:'loc',pid:p.id,iid:id});break;
    case 'ask':V.confirm=id;keepScroll(render);break;
    case 'noconfirm':V.confirm=null;keepScroll(render);break;
    case 'delP':S.projects=S.projects.filter(x=>x.id!==p.id);save();toast('Проект удалён');V={screen:'projects'};render();break;
    case 'delV':p.videos=p.videos.filter(x=>x.id!==V.vid);save();toast('Ролик удалён');V={screen:'project',pid:p.id,tab:'videos'};render();break;
    case 'delI':{const k=V.screen==='hero'?'heroes':'locations';p[k]=p[k].filter(x=>x.id!==V.iid);save();toast('Удалено');V={screen:'project',pid:p.id,tab:'lib'};render();break}
    case 'opt':{const cx=CX();const k=t.dataset.k,max=+t.dataset.max;const game=(V.screen==='hero'||V.screen==='loc')&&cx.c._mode==='game';const qB=game?gameList(cx.c)[cx.c._gi||0]:null;
      if(max>1){const arr=cx.c[k]=Array.isArray(cx.c[k])?cx.c[k]:[];if(arr.includes(id))cx.c[k]=arr.filter(x=>x!==id);else{if(arr.length>=max){toast(`Можно выбрать не больше ${max}. Сними лишнее`);break}arr.push(id)}}
      else cx.c[k]=cx.c[k]===id?'':id;
      if(cx.v)cx.v.updated=today();
      if(game){const c=cx.c;
        delete c['_auto.'+k];if(k==='place'){c.scope='';c.room='';c.parent=''}if(k==='scope'){c.room='';c.parent=''}if(k==='alive'&&c.kind&&!(c.alive==='Неживой'?HNON:HLIVE).includes(c.kind))c.kind='';
        if(k.startsWith('sit.'))recomputeArch(c);
        if(qB&&qB.k===k&&!qB.counts&&max===1&&c[k]){if(qB.like){save();render();scrollGame();break}gAdvance(c);break}}
      save();keepScroll(render);break}
    case 'hmode':{const c=CX().c;c._mode=id;if(id==='game')c._gi=c._gi||0;save();keepScroll(render);break}
    case 'htab':{V.htab=id;render();document.querySelector('.htabs')?.scrollIntoView({block:'start'});break}
    case 'gnext':{const c=CX().c;let q=gameList(c)[c._gi||0];
      if(q&&q.k==='place'&&!c.place&&(c.placeOwn||'').trim()){if(placeFromText(c,c.placeOwn))toast('Похоже на «'+c.place+'» — задам вопросы про это место')}
      if(q&&q.k==='scope'&&!c.scope){toast('Выбери: общая картина или одно место внутри');break}
      if(q&&(q.k==='kind'||q.k==='place')&&!q.like&&!c[q.k]&&!(c[q.k+'Own']||'').trim()){toast('Выбери вариант или впиши свой');break}
      if(q&&q.like&&!c[q.k]){toast('Выбери ближайший вариант — тогда пойдут подходящие вопросы');break}
      gAdvance(c);break}
    case 'gback':{const c=CX().c;c._gi=Math.max(0,(c._gi||0)-1);save();render();scrollGame();break}
    case 'gjump':{const c=CX().c;if(c._done){c._done=0;c._ret=gameList(c).length-1}if(c._ret==null)c._ret=c._gi||0;c._gi=+id;if(c._ret===c._gi)c._ret=null;save();render();scrollGame();break}
    case 'gret':{const c=CX().c;c._gi=c._ret||0;c._ret=null;save();render();scrollGame();break}
    case 'gskip':{const c=CX().c;const q=gameList(c)[c._gi||0];const pick=a=>a[Math.floor(Math.random()*a.length)];
      const pool=o=>flatO(o||[]).map(x=>typeof x==='string'?x:x.v).filter(x=>!/^(Нет, не нужно|Неважно)/.test(x));
      if(q.counts||q.k==='_name'){}
      else if(q.style){c.style=pick(['Объёмный 3D','Рисованный 2D','Детская книжка']);c['_auto.style']=1}
      else if(q.k.startsWith('sit.')){c[q.k]=pick(q.o).v;c['_auto.'+q.k]=1;recomputeArch(c)}
      else if(q.o&&q.o.length){const p=pool(q.o);if(p.length){c[q.k]=(q.max||1)>1?[pick(p)]:pick(p);c['_auto.'+q.k]=1}}
      if(q.like){save();render();scrollGame();break}
      gAdvance(c);break}
    case 'newInner':{const cx=CX();const par=cx.x;const nx={id:uid(),name:'',c:{place:par.c.place,placeOwn:par.c.placeOwn||'',scope:lscope(par.c).inner,parent:par.name||'Без названия',_mode:'game',_gi:2}};cx.p.locations.push(nx);save();go({screen:'loc',pid:cx.p.id,iid:nx.id});break}
    case 'gredo':{const c=CX().c;c._done=0;c._gi=0;c._ret=null;save();render();scrollGame();break}
    case 'lfromhero':{const cx=CX();const hp=heroPlaces(cx.p)[+id];if(hp){useHeroPlace(cx.x,hp);save();render();toast('Место героя подставлено — отвечай дальше')}break}
    case 'zoom':{openZoom(id,true);break}
    case 'zclose':{document.getElementById('zoom').hidden=true;break}
    case 'take':{setResult(document.getElementById(id).textContent);toast('Готово — записала в поле внизу');break}
    case 'takeFixes':{const fx=[...document.querySelectorAll('#fixes li')].map(li=>'— '+li.textContent).join('\n');setResult(fx);toast('Правки записаны');break}
    case 'copy':{const el=document.getElementById(id);try{await navigator.clipboard.writeText(el.value);toast('Скопировано — теперь вставь в ChatGPT')}catch(err){el.focus();el.select();toast('Выделено — нажми Ctrl+C')}break}
    case 'backup':openBackup();break;
    case 'closeM':document.getElementById('modal').hidden=true;break;
    case 'dl':{try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const an=document.createElement('a');an.href=u;an.download='multivarka-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(an);an.click();an.remove();toast('Файл скачивается')}catch(err){toast('Здесь скачать нельзя — скопируй текст')}break}
    case 'cpJson':{const el=document.getElementById('bjson');try{await navigator.clipboard.writeText(el.value);toast('Скопировано')}catch(err){el.focus();el.select()}break}
    case 'impText':{try{const d=JSON.parse(document.getElementById('bimp').value);if(!Array.isArray(d.projects))throw 0;S=d;save();document.getElementById('modal').hidden=true;toast('Проекты загружены');V={screen:'projects'};render()}catch(err){document.getElementById('berr').textContent='Не получилось прочитать. Вставь текст копии целиком, от первой { до последней }.'}break}
  }
});
function openBackup(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="panel modal" role="dialog" aria-label="Резервная копия"><div class="head"><h2>Резервная копия</h2><button class="btn small" data-a="closeM">Закрыть</button></div>
    <div class="meta">Все проекты хранятся в этом браузере. Сохраняй копию, чтобы перенести их на другой компьютер или не потерять.</div>
    <div class="actions"><button class="btn sun" data-a="dl">⬇ Скачать файл копии</button><button class="btn" data-a="cpJson">Скопировать текст</button></div>
    <textarea id="bjson" readonly style="min-height:80px;font-size:12px">${esc(JSON.stringify(S))}</textarea>
    <h3>Загрузить копию</h3><input type="file" id="bfile" accept=".json,application/json">
    <textarea id="bimp" placeholder="…или вставь текст копии сюда" style="min-height:70px;font-size:12px"></textarea>
    <div class="actions"><button class="btn pink" data-a="impText">Загрузить из текста</button><span class="meta" style="color:#c0264f" id="berr"></span></div>
    <div class="meta">Загрузка заменит все текущие проекты.</div></div>`;
  m.hidden=false;
  document.getElementById('bfile').addEventListener('change',ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('bimp').value=r.result;document.querySelector('[data-a=impText]').click()};r.readAsText(f)});
}
function openZoom(name,sticky){const st=STYLE_BY[name];if(!st)return;const z=document.getElementById('zoom');z.innerHTML=`<div class="zbox" ${sticky?'data-a="zclose"':''}>${STYLE_IMG[name]?`<img src="${STYLE_IMG[name]}" alt="Пример стиля ${esc(name)}">`:`<svg viewBox="0 0 100 100" aria-hidden="true">${ART[name]||''}</svg>`}<b>${esc(name)}</b><span class="meta">${esc(st.h)}</span>${sticky?'<span class="hint">Нажми, чтобы закрыть. Картинку можно сохранить и приложить к промпту как образец стиля</span>':''}</div>`;z.classList.toggle('sticky',!!sticky);z.hidden=false}
